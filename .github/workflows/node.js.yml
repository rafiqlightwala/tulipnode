name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24, 25, 26]
        os: [macos-14, ubuntu-22.04]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      env:
        npm_config_build_from_source: "true"
      run: npm ci

    - name: Run Tests
      run: npm test

    - name: Run Example Script
      run: node example.js

    - name: Publish Binaries (Non-Windows)
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.os != 'windows-latest' }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: ./node_modules/.bin/node-pre-gyp package unpublish publish info
